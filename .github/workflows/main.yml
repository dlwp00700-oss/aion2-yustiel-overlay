
name: Publish AION2 v1.8.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download verified v1.8.4 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous | Out-Null
          gh release download v1.8.4 --pattern 'AION2_Yustiel_Overlay_Update.zip' --dir previous

      - name: Prepare v1.8.5 from the existing v1.8.4 release
        shell: pwsh
        env:
          PATCH_B64: ''
        run: |
          @'
          import os, io, json, zlib, base64, hashlib, zipfile
          from pathlib import Path
          blob = Path('previous/AION2_Yustiel_Overlay_Update.zip').read_bytes()
          assert hashlib.sha256(blob).hexdigest() == 'd283978f6b6df19b224a8bafee8ff7074f9d7a2ccd491f1a19f20564185a78a5', 'v1.8.4 release ZIP does not match the verified original'
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              content = {n.partition('/')[2]: z.read(n) for n in z.namelist() if not n.endswith('/')}
          edits = json.loads(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode('utf-8'))
          for name, change in edits.items():
              if 'add' in change:
                  content[name] = change['add'].encode('utf-8')
              else:
                  raw = content[name]
                  lines = raw.decode('utf-8-sig').splitlines(keepends=True)
                  for start, end, new in reversed(change['edits']):
                      lines[start:end] = new.splitlines(keepends=True)
                  content[name] = (b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b'') + ''.join(lines).encode('utf-8')
          assert b"[Version]'1.8.5'" in content['AION2_Overlay.ps1']
          assert hashlib.sha256(content['AION2_Overlay.ps1']).hexdigest() == '3fe7e8c0305d4943526e134fddb05e58694dac069a1cb8c784a8bc8c62121b62', 'Unexpected patched source'
          root = Path('app')
          root.mkdir(exist_ok=True)
          for name, data in content.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          artifact = Path('AION2_Yustiel_Overlay_Update.zip')
          with zipfile.ZipFile(artifact, 'w', zipfile.ZIP_DEFLATED) as z:
              for name, data in sorted(content.items()):
                  z.writestr('AION2_Yustiel_Overlay_v1.8.5/' + name, data)
          print('Created', artifact, 'with', len(content), 'files')
          '@ | Set-Content -Encoding utf8 build_release.py
          python build_release.py

      - name: Check PowerShell syntax before publishing
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'app/AION2_Overlay.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error; exit 1 }

      - name: Commit the updated app source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Update overlay app to v1.8.5'
          git push origin HEAD:main

      - name: Publish the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.8.5 './AION2_Yustiel_Overlay_Update.zip' --target main --title 'AION2 Overlay v1.8.5' --notes '전체 일정 / 간단히 보기 전환 기능 추가.'
